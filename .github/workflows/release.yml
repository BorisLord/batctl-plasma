name: build-and-release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

env:
  BATCTL_VERSION: v2026.3.13

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            container: fedora:45
          - distro: ubuntu
            container: ubuntu:26.10
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - name: Install build dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: dnf install -y git cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel curl tar

      - name: Install build dependencies (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake ninja-build g++ qt6-base-dev qt6-declarative-dev curl tar ca-certificates

      - uses: actions/checkout@v7

      - name: Build and test
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DESTDIR="$PWD/staging" cmake --install build
          mkdir -p staging/usr/bin
          curl -fsSL -o batctl.tar.gz \
            "https://github.com/Ooooze/batctl/releases/download/${BATCTL_VERSION}/batctl-${BATCTL_VERSION#v}-linux-x86_64.tar.gz"
          tar -xzf batctl.tar.gz -C staging/usr/bin batctl
          staging/usr/bin/batctl set --help
          asset="batctl-plasma-${GITHUB_REF_NAME}-${{ matrix.distro }}-x86_64.tar.gz"
          tar -C staging -czf "$asset" usr
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.distro }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            scripts/install.sh
            scripts/uninstall.sh
